server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle Angular routes by redirecting to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Serve error pages from index.html
    error_page 404 /index.html;

    # Optional: Add caching headers for static files
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
