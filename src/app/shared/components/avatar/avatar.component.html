<div class="avatar" [ngClass]="sizeClass">
	@if (avatar) {
		<img id="img" [src]="avatar" alt="avatar" />
	} @else {
		@if (male) {
			<img id="boy" src="./assets/images/avatar-boy-default.png" alt="avatar" />
		} @else {
			<img class="girl" src="./assets/images/avatar-girl-default.png" alt="avatar" />
		}
	}
</div>
